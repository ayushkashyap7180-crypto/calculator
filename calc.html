<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons">
            <button onclick="clearDisplay()">Clear</button>
            <button onclick="deleteLast()">backspace</button>
            <button onclick="addValue('%')">%</button>
            <button onclick="addValue('/')">÷</button>

            <button onclick="addValue('7')">thala</button>
            <button onclick="addValue('8')">ate</button>            
            <button onclick="addValue('9')">no</button>
            <button onclick="addValue('*')">×</button>

            <button onclick="addValue('4')">squad</button>
            <button onclick="addValue('5')">fingers in one hand</button>
            <button onclick="addValue('6')">Orry</button>
            <button onclick="addValue('-')">−</button>

            <button onclick="addValue('1')">0!</button>
            <button onclick="addValue('2')">1+1</button>
            <button onclick="addValue('3')">amir khan's wifes</button>
            <button onclick="addValue('+')">+</button>

            <button onclick="addValue('0')" class="zero">0</button>
            <button onclick="addValue('.')">.</button>
            <button onclick="calculate()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
